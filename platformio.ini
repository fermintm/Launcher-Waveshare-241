; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = waveshare-esp32-s3-touch-amoled-241v1

boards_dir = boards/_jsonfiles
build_cache_dir = .pio/buildcache
cache_dir = .pio/cache
core_dir = .pio/core

extra_configs =
	boards/*.ini
	boards/*/*.ini

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages = framework-arduinoespressif32-libs @ https://github.com/bmorcelli/myLibBuilder/releases/download/builds/launcher_keyboot_esp32-arduino-libs-20260910-173758.tar.gz
monitor_filters = esp32_exception_decoder, send_on_enter, colorize
monitor_speed = 115200
framework = arduino
board_build.variants_dir = boards
board_upload.offset_address = 0x10000
extra_scripts =
	pre:support_files/check_submodules.py
	pre:support_files/prep_web_files.py
	pre:support_files/clang_format.py
	support_files/enable_lto.py
	pre:support_files/upload_patch.py
	post:support_files/merge.py

build_flags =
	-I include

	-DLAUNCHER='"dev"'
	-DWIFI_ENC_KEY='"LauncherWifi2025!"'
	-DMAXFILES=256
	-DCONFIG_FILE='"/config.conf"'

	-DDISABLE_ALL_LIBRARY_WARNINGS
	; --- New GCC Flags for size ---
	-flto
	-ffunction-sections
	-fdata-sections
	-fno-rtti
	-fno-threadsafe-statics
	-fno-common
	-fno-exceptions
	-Os

	; --- Flags for warnings ---
	-w
	-Wl,--print-memory-usage
	-Wl,--gc-sections

	; --- ESP32 SDK Flags for size  ---
	-DCORE_DEBUG_LEVEL=0
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1
	-DCONFIG_COMPILER_OPTIMIZATION_ASSERTION_LEVEL=0
	-DCONFIG_ESP_SYSTEM_PANIC=0
	-DCONFIG_MBEDTLS_DEBUG=0
